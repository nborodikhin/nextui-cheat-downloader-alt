# Manual build of every package, versioned vX.Y.Z+<commit>. Makes no release.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the newest release tag.
          fetch-depth: 0

      - name: Build and package
        run: |
          VERSION=$(./dev version get --identifier "${GITHUB_SHA::7}")
          ./dev dist all --version "$VERSION"

      - name: Upload the all-platform package
        uses: actions/upload-artifact@v7
        with:
          path: dist/CheatDownloaderOffline.pakz
          archive: false
          if-no-files-found: error

      - name: Upload the tg5040 package
        uses: actions/upload-artifact@v7
        with:
          path: dist/CheatDownloaderOffline-tg5040.pakz
          archive: false
          if-no-files-found: error

      - name: Upload the tg5050 package
        uses: actions/upload-artifact@v7
        with:
          path: dist/CheatDownloaderOffline-tg5050.pakz
          archive: false
          if-no-files-found: error

      - name: Upload the my355 package
        uses: actions/upload-artifact@v7
        with:
          path: dist/CheatDownloaderOffline-my355.pakz
          archive: false
          if-no-files-found: error

      - name: Upload the h700 package
        uses: actions/upload-artifact@v7
        with:
          path: dist/CheatDownloaderOffline-h700.pakz
          archive: false
          if-no-files-found: error
