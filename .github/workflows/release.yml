# A pushed v* tag publishes a GitHub Release. vX.Y.Z must match pak.json and
# have a changelog note; vX.Y.Z-<label>.N is a pre-release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Require a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo 'A release requires a tag.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check release version
        id: version
        run: |
          VERSION="$GITHUB_REF_NAME"
          ./dev version validate-release "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: version
    uses: ./.github/workflows/test.yml
    # The Pages job of test.yml asks for these; it does not run for a tag.
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and package release
        run: ./dev dist all --strict --version "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=(--latest)
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          fi
          NOTE=$(./dev version note "$VERSION")
          if [ -n "$NOTE" ]; then
            FLAGS+=(--notes "$NOTE")
          else
            FLAGS+=(--generate-notes)
          fi
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            "${FLAGS[@]}" \
            dist/*.pakz
