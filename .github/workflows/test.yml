# Runs the host tests with coverage on every push and pull request. A push to
# main also publishes the coverage report to GitHub Pages.
name: Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e harness can block on a hung app; fail fast instead.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gcovr
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcovr

      - name: Run the tests with coverage
        run: ./dev test --coverage

      - name: Upload the coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage/

  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
